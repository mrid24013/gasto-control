<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Registro - Control de Gastos</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="card mx-auto shadow" style="max-width: 450px;">
                <div class="card-body">
                    <h3 class="text-center mb-4">Crear Cuenta</h3>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>Usuario</label>
                            <input type="text" name="username" id="id_username" class="form-control" required>
                        </div>
        
                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input type="password" name="password1" id="id_password1" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Confirmar Contraseña</label>
                            <input type="password" name="password2" id="id_password2" class="form-control" required>
                        </div>


                        <p class="text-wrap bg-body-secondary border mt-2">
                            <label>◉ Su contraseña no puede ser muy similar a su otra información personal.</label>
                            <label class="mt-3">◉ Debe contener al menos 8 caracteres.</label>
                            <label class="mt-3">◉ Su contraseña no puede ser una contraseña de uso común.</label>
                            <label class="mt-3">◉ Su contraseña no puede ser completamente numérica.</label>
                        </p>
        
                        <button type="submit" class="mt-2 btn btn-primary w-100">Registrar</button>
                    </form>
                    <p class="text-center mt-3">
                        ¿Ya tienes cuenta?
                        <a href="/login/">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
