<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Nuevo Movimiento</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <style>
            .help-button {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
                background-color: #007bff;
                color: white;
                border-radius: 50%;
                font-size: 30px;
                text-align: center;
                line-height: 60px;
                text-decoration: none;
                box-shadow: 0 4px 8px rgba(0,0,0,0.3);
                transition: 0.3s;
            }
        
            .help-button:hover {
                background-color: #0056b3;
                transform: scale(1.1);
            }
        </style>
    </head>
    <body class="bg-light">
    
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand">Control de Gastos de {{ user.username }}</span>
                <a href="/home/" class="btn btn-success btn-sm">Regresar</a>
            </div>
        </nav>

        <div class="container mt-4">
            <div class="card">
                <div class="card-body">
                    <h4>Registrar Movimiento</h4>
        
                    <form method="post">
                        {% csrf_token %}
        
                        <div class="mb-3">
                            <label>Monto</label>
                            <input type="number" name="monto" id="monto" step="0.01" class="form-control" required>
                        </div>
        
                        <div class="mb-3">
                            <label>Descripción</label>
                            <input type="text" name="descripcion" id="descripcion" step="0.01" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Fecha</label>
                            <input type="datetime-local" name="fecha" id="fecha" step="60" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Categoría</label>
                            <select class="form-select" name="categoria" id="categoria_id" required>
                                <option value="">Seleccione una categoría</option>
                                    {% for categoria in form.categoria.field.queryset %}
                                        <option value="{{ categoria.id }}">
                                            {{ categoria.nombre }}
                                        </option>
                                    {% endfor %}
                            </select>
                        </div>
        
                        <button type="submit" class="btn btn-success">Crear Movimiento</button>
                    </form>
                </div>
            </div>
        </div>
        <a href="/help/" class="help-button">?</a>
    </body>
</html>
