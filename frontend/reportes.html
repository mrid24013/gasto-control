<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Control de Gastos</span>
        <a href="/movimiento/crear/" class="btn btn-success btn-sm">Agregar Movimiento</a>
        <a href="/categoria/crear/" class="btn btn-success btn-sm">Agregar Categoria</a>
        <a href="/login/" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
    </div>
</nav>

<div class="container mt-4">
    <h4>Balance General</h4>
    <p><strong>Ingresos:</strong> $0.00</p>
    <p><strong>Gastos:</strong> $0.00</p>
    <p><strong>Total:</strong> $0.00</p>
</div>


<div class="container mt-4">
    <h4>Reporte de Movimientos</h4>
    <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
            <tr>
                <th>Registros</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                {% csrf_token %}
                <td>${{ table.as_p }}</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
