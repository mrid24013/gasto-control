<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Editar Categoría</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <style>
            .help-button {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
                background-color: #007bff;
                color: white;
                border-radius: 50%;
                font-size: 30px;
                text-align: center;
                line-height: 60px;
                text-decoration: none;
                box-shadow: 0 4px 8px rgba(0,0,0,0.3);
                transition: 0.3s;
            }
        
            .help-button:hover {
                background-color: #0056b3;
                transform: scale(1.1);
            }
        </style>
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand">Control de Gastos de {{ user.username }}</span>
            </div>
        </nav>

        <div class="container mt-4">
            <div class="card">
                <div class="card-body">
                    <h4>Editar Categoría</h4>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label>Nombre</label>
                            {{form.nombre}}
                        </div>

                        <div class="mb-3">
                            <label>Tipo</label>
                            {{form.tipo}}
                        </div>
        
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a href="/categorias/" class="btn btn-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
        <a href="/help/" class="help-button">?</a>
    </body>
</html>
